<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus.chat — Client OpenRouter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='url(%23g)'/%3E%3Cpath d='M50 22 L72 62 L50 52 L28 62 Z' fill='white'/%3E%3Ccircle cx='50' cy='72' r='7' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/vendor/highlight-github.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Barre latérale : liste des discussions -->
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-name">Nexus<span class="brand-dot">.</span>chat</span>
      </div>
      <div class="sidebar-header">
        <button id="new-chat" class="btn-primary">+ Nouvelle discussion</button>
      </div>
      <ul id="chat-list"></ul>
      <div class="sidebar-footer">
        <span class="muted">Sauvé dans ./chats/</span>
      </div>
    </aside>

    <!-- Zone principale -->
    <main id="main">
      <header id="topbar">
        <button id="toggle-sidebar" class="icon-btn" title="Afficher/masquer"></button>

        <!-- Sélecteur de modèle : bouton + panneau arborescent -->
        <div id="model-picker">
          <button id="model-btn" title="Choisir un modèle">
            <span id="model-btn-label">Choisir un modèle…</span>
            <span class="chev">▾</span>
          </button>
          <button id="fav-toggle" title="Ajouter/retirer des favoris"></button>

          <div id="model-panel" hidden>
            <div class="mp-header">
              <input
                id="model-filter"
                type="text"
                placeholder="Rechercher un modèle…"
                autocomplete="off"
              />
              <button id="img-filter" title="N'afficher que les modèles qui génèrent des images"></button>
            </div>
            <div id="model-tree"></div>
          </div>
        </div>

        <span id="status" class="muted"></span>
        <button id="usage-btn" class="icon-btn" title="Bilan de consommation"></button>
        <button id="settings-btn" class="icon-btn" title="Instructions & réglages"></button>
      </header>

      <section id="messages"></section>

      <footer id="composer">
        <!-- Aperçu des pièces jointes en attente -->
        <div id="attachments" hidden></div>
        <div class="composer-row">
          <button id="attach-btn" class="icon-btn" title="Joindre une image ou un document"></button>
          <button id="settings-btn-bottom" class="icon-btn" title="Instructions & réglages"></button>
          <input id="file-input" type="file" multiple hidden
                 accept="image/*,.pdf,.txt,.md,.markdown,.csv,.json,.js,.ts,.py,.html,.css,.xml,.yaml,.yml,.log" />
          <textarea
            id="input"
            rows="1"
            placeholder="Écris ton message…  (Entrée = envoyer, Maj+Entrée = nouvelle ligne)"
          ></textarea>
          <button id="send" class="btn-primary">Envoyer</button>
          <button id="stop" class="btn-secondary" hidden>Stop</button>
        </div>
        <div id="drop-hint">Dépose tes fichiers ici</div>
      </footer>
    </main>
  </div>

  <!-- Lightbox : agrandissement d'une image -->
  <div id="lightbox" hidden>
    <div id="lightbox-toolbar">
      <a id="lightbox-dl" title="Télécharger"></a>
      <button id="lightbox-close" title="Fermer (Échap)"></button>
    </div>
    <img id="lightbox-img" alt="image agrandie" />
  </div>

  <!-- Modale : instructions système + réglages -->
  <div id="settings-modal" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3>Instructions &amp; réglages</h3>
        <button id="settings-close" class="modal-x" title="Fermer"></button>
      </div>
      <div class="modal-body">
        <label class="sp-label" for="system-prompt">Instructions système (cette discussion)</label>
        <textarea id="system-prompt" rows="4"
          placeholder="Ex. : Réponds en français, de façon concise. Tu es un expert en…"></textarea>

        <label class="sp-label" for="temp-range">
          Température : <span id="temp-val">1.0</span>
        </label>
        <input id="temp-range" type="range" min="0" max="2" step="0.1" value="1" />
        <div class="sp-hint">0 = précis/déterministe · 2 = très créatif</div>

        <label class="sp-label" for="maxtok">Longueur max (tokens, 0 = illimité)</label>
        <input id="maxtok" type="number" min="0" step="128" value="0" />

        <div class="sp-defaults">
          <button id="set-default-btn" class="btn-outline">Définir comme réglages par défaut</button>
          <div class="sp-hint">Appliqués à chaque nouvelle discussion (surchargeables ici).</div>
          <span id="set-default-ok" class="sp-ok" hidden>✓ Enregistré comme défaut</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modale : bilan de consommation -->
  <div id="usage-modal" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3>Bilan de consommation</h3>
        <button id="usage-close" class="modal-x" title="Fermer"></button>
      </div>
      <div class="modal-body" id="usage-body">
        <div class="muted">Chargement…</div>
      </div>
    </div>
  </div>

  <!-- Libs vendorisées en local (aucun CDN à l'exécution) -->
  <script src="/vendor/markdown-it.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
